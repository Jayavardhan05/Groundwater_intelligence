# Groundwater level forecasting - configured for the well-monitoring CSV schema
# (Well ID, Date, Water_Level_numeric, quality flags, ...). Paths relative to repo root.

data:
  processed_path: ml/data/processed/groundwater_cleaned_all_records.csv   # <- change to your file name
  well_col: "Well ID"
  time_col: Date                          # ISO yyyy-mm-dd column (not Date_original)
  target_col: Water_Level_numeric         # depth to water level, metres below ground (higher = deeper)

  feature_cols: []                        # no time-varying covariates in this file yet (see note below)
  static_cols:                            # constant per well; added as model inputs
    - Latitude
    - Longitude
    - Well_Depth_numeric

  # Row-quality filters (applied before anything else)
  keep_where:
    Measurement_Status: [numeric_measurement]
    # Mode: [manual]                      # uncomment to train on one measurement mode only
  drop_where_true:
    - Flag_Negative_Level
    - Flag_Level_Over_100m
    - Flag_Level_Outside_0_100m
    - Flag_Level_Exceeds_Well_Depth

  freq: MS                                # !!! run `python -m ml.src.inspect_data` and confirm this
  max_interp_gap: 2
  min_rows_per_well: 30

sequence:
  lookback: 12
  horizon: 1
  include_target_as_input: true

tabular:
  target_lags: [0, 1, 2, 3, 6, 12]
  feature_lags: [1, 3]                    # applies to dynamic covariates only (none yet)
  rolling_windows: [3, 6]
  seasonal_features: true

split:
  strategy: temporal                      # temporal | well (hold out whole wells)
  train_frac: 0.70
  val_frac: 0.15
  seed: 42

scaling:
  scale_target: true

models:
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 64
    epochs: 100
    patience: 10
  rf:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    n_jobs: -1
    random_state: 42
  xgb:
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
    random_state: 42

artifacts_dir: ml/artifacts
